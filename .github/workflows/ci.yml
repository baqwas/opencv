name: OpenCV Monorepo CI

on:
  push:
    branches: [ "main", "master", "5.x" ]
  pull_request:
    branches: [ "main", "master", "5.x" ]

jobs:
  build-cpp:
    name: Build C++ Exercises
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Tools and OpenCV
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libopencv-dev

      - name: Configure CMake for C++ Exercises
        run: |
          mkdir -p cpp/build
          cd cpp/build
          cmake -DCMAKE_BUILD_TYPE=Release ..

      - name: Compile C++ Targets
        run: |
          cd cpp/build
          cmake --build . --parallel $(nproc)

  check-python:
    name: Check Python Syntax
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '>=3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f python/requirements.txt ]; then pip install -r python/requirements.txt; fi

      - name: Validate Python Code Syntax
        run: |
          python -m compileall python/

  build-android:
    name: Build Android Module
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew || true

      - name: Build Android Project (Debug)
        run: |
          cd android
          # If a root wrapper exists, build the project; otherwise run gradle task directly
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi
