# ==============================================================================
# File:             .github/workflows/ci.yml
# Workflow:         OpenCV Monorepo CI
# Version:          1.2.0
# Architect:        A Reza M Wajih
# Description:      Continuous Integration pipeline for compiling C++ artifacts,
#                   validating Python modules, and building Android binaries.
#
# Update History:
# ------------------------------------------------------------------------------
# Version | Date       | Author           | Modification Description
# --------|------------|------------------|-------------------------------------
# 1.0.0   | 2026-08-18 | Initial Commit   | Baseline multi-environment builds.
# 1.1.0   | 2026-08-19 | Matha Goram      | Hardened apt mirrors, implemented
#         |            |                  | step timeouts, added concurrency,
#         |            |                  | pip caching, and minimum permissions.
# 1.2.0   | 2026-08-19 | Matha Goram      | Added cache-dependency-path for pip
#         |            |                  | setup; expanded apt timeout to 10m.
# ==============================================================================

name: OpenCV Monorepo CI

on:
  push:
    branches: [ "main", "master", "5.x" ]
  pull_request:
    branches: [ "main", "master", "5.x" ]

# Cancel redundant in-progress runs on PRs to save compute time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Principle of Least Privilege: read-only access to repository contents
permissions:
  contents: read

jobs:
  build-cpp:
    name: Build C++ Exercises
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fix apt mirrors, update, and install tools
        run: |
          sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/sources.list
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libopencv-dev
        timeout-minutes: 10

      - name: Configure CMake for C++ Exercises
        run: |
          mkdir -p cpp/build
          cd cpp/build
          cmake -DCMAKE_BUILD_TYPE=Release ..

      - name: Compile C++ Targets
        run: |
          cd cpp/build
          cmake --build . --parallel $(nproc)
        timeout-minutes: 20

  check-python:
    name: Check Python Syntax
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '>=3.11'
          cache: 'pip'
          cache-dependency-path: 'python/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f python/requirements.txt ]; then pip install -r python/requirements.txt; fi
        timeout-minutes: 5

      - name: Validate Python Code Syntax
        run: |
          python -m compileall python/

  build-android:
    name: Build Android Module
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew || true

      - name: Build Android Project (Debug)
        run: |
          cd android
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi
        timeout-minutes: 30
