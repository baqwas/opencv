name: OpenCV Monorepo CI

on:
  push:
    branches: [ "main", "master", "5.x" ]
  pull_request:
    branches: [ "main", "master", "5.x" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # Phase 1 & 3: Build C++ with ccache Acceleration and Artifact Export
  # --------------------------------------------------------------------------
  build-cpp:
    name: Build C++ Exercises (ccache)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fix apt mirrors, update, and install tools
        run: |
          sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/sources.list
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libopencv-dev ccache
        timeout-minutes: 10

      - name: Setup ccache Cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Configure ccache
        run: |
          ccache -M 50M
          ccache -s

      - name: Configure CMake for C++ Exercises
        run: |
          mkdir -p cpp/build
          cd cpp/build
          cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache ..

      - name: Compile C++ Targets
        run: |
          cd cpp/build
          cmake --build . --parallel $(nproc)
        timeout-minutes: 20

      - name: Show ccache Statistics
        run: ccache -s

      - name: Upload C++ Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cpp-binaries
          path: cpp/build/
          retention-days: 7

  # --------------------------------------------------------------------------
  # Phase 2: Matrix Python Syntax and Compatibility Checking
  # --------------------------------------------------------------------------
  check-python:
    name: Check Python Syntax (Py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'python/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f python/requirements.txt ]; then pip install -r python/requirements.txt; fi
        timeout-minutes: 5

      - name: Validate Python Code Syntax
        run: |
          python -m compileall python/

  # --------------------------------------------------------------------------
  # Phase 2: Automated Code Quality & Lint Gate
  # --------------------------------------------------------------------------
  code-quality:
    name: Code Quality & Lint Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pre-commit
        run: pip install pre-commit

      - name: Run Pre-commit Hooks Across Repository
        run: pre-commit run --all-files

  # --------------------------------------------------------------------------
  # Phase 2: Automated Security Secret Scanning via GitGuardian
  # --------------------------------------------------------------------------
  security-scan:
    name: GitGuardian Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for ggshield to scan full commit history

      - name: Run ggshield Secret Scan
        uses: GitGuardian/ggshield-action@v1.28.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

  # --------------------------------------------------------------------------
  # Phase 1 & 3: Android Build with Enhanced Caching & Artifact Export
  # --------------------------------------------------------------------------
  build-android:
    name: Build Android Module
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew || true

      - name: Build Android Project (Debug)
        run: |
          cd android
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi
        timeout-minutes: 30

      - name: Upload Android Build Outputs
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apks
          path: android/**/build/outputs/**/*.apk
          retention-days: 7
