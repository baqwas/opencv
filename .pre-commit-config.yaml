# ==============================================================================
# File:             .pre-commit-config.yaml
# Description:      Enterprise-grade pre-commit hooks configuration for the
#                   OpenCV monorepo. Enforces code formatting, YAML validity,
#                   and file size limits.
# Architect:        Matha Goram
# ==============================================================================

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        name: Trim Trailing Whitespace
      - id: end-of-file-fixer
        name: Fix End of Files
      - id: check-yaml
        name: Validate YAML Syntax
      - id: check-added-large-files
        name: Check for Large Files
        args: ['--maxkb=1024'] # Explicitly blocks files larger than 1MB from being committed
